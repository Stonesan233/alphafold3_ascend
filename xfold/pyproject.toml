[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xfold"
authors = [{ name = "Shenggan Cheng", email = "shenggan.c@u.nus.edu" }]
description = "fold for everyone."
readme = { file = "README.md", content-type = "text/markdown" }
dynamic = ["version"]
dependencies = [
    "torch", 
    "einops",
    # Required by run_alphafold.py via the alphafold3 data pipeline / model
    # imports (alphafold3.model.model -> tokamax, confidences -> jax.numpy,
    # model params -> dm-haiku). CPU builds are sufficient.
    "jax",
    "dm-haiku",
    "tokamax",
]

[tool.setuptools]
packages = ["xfold"]

[tool.setuptools.dynamic]
version = { attr = "xfold.version.VERSION" }